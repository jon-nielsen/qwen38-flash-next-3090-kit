# Profile A — 8x RTX 3090 (24 GB, sm_86, PCIe only): max capacity.
#   v2 image (vLLM 0.13 base, VLLM_DETERMINISTIC_MOE_ALIGN=0). Measured
#   (2026-09-16, 12-pass pooled meter): KV pool 1,317,519 (5.03x @262k),
#   P1 131.0 tok/s warm, 4-stream aggregate median 238.7 (range 223.5-265.3),
#   BF16 KV, max_num_seqs=32. Success line: "GPU KV cache size: 1,317,519
#   tokens" (~7 min cold boot). Use when you need the 3x pool or best
#   single-stream latency; Profile B wins 4-stream aggregate.
# DEFAULT: halt95's checkpoint AS-IS — no surgery. The optional bf16mtp
#   surgery in surgery/ is kept for series reproducibility only (it measured
#   slower multi-stream in the v1 A/B; see README).
# Oracle 4/4 semantically correct on this shape; bitwise output identity is a
#   same-TP-shape property (see README before comparing hashes across rigs).
# PP REQUIRES the NCCL_P2P_DISABLE/VLLM_SKIP_P2P_CHECK/disable-custom-all-reduce trio below.
# Run:
#   cd <this-repo>/composes && MODEL=/path/to/merlin-checkpoint VLLM_API_KEY=... \
#     docker compose -f profile-a-8gpu-tp4pp2-mtp4-bf16kv.yml up -d
services:
  vllm:
    image: ghcr.io/jon-nielsen/vllm-backport-flashnext-sm86:2b21fbe-bfe237ee
    container_name: flashnext-3090-8gpu
    ports:
      - "8000:8000"
    devices:
      - nvidia.com/gpu=all
    shm_size: "32g"
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    environment:
      - CUDA_VISIBLE_DEVICES=0,1,2,7,3,4,5,6
      - VLLM_PLE_FP8_EMBEDDING=1
      - VLLM_DETERMINISTIC_MOE_ALIGN=0
      - NCCL_ALGO=Ring
      - NCCL_PROTO=LL128
      - NCCL_P2P_DISABLE=1
      - VLLM_SKIP_P2P_CHECK=1
      - TRITON_CACHE_DIR=/root/cache/triton
      - TORCHINDUCTOR_CACHE_DIR=/root/cache/torchinductor
      - VLLM_CACHE_ROOT=/root/cache/vllm
      - CUDA_CACHE_PATH=/root/cache/nvidia-cuda
      - TORCH_EXTENSIONS_DIR=/root/cache/torch_extensions
    volumes:
      - ${MODEL}:/model:ro
      - hf-cache:/root/.cache/huggingface
      - flashnext-cache-triton:/root/cache/triton
      - flashnext-cache-torchinductor:/root/cache/torchinductor
      - flashnext-cache-vllm:/root/cache/vllm
      - flashnext-cache-nvidia-cuda:/root/cache/nvidia-cuda
      - flashnext-cache-torch_extensions:/root/cache/torch_extensions
    command: |
      --model /model
      --served-model-name Qwen3.8-Flash-Next
      --api-key ${VLLM_API_KEY:?set VLLM_API_KEY}
      --tensor-parallel-size 4
      --pipeline-parallel-size 2
      --enable-expert-parallel
      --gpu-memory-utilization 0.92
      --max-model-len 262144
      --max-num-seqs 32
      --max-num-batched-tokens 4096
      --compilation-config '{"cudagraph_mode": "FULL_AND_PIECEWISE", "cudagraph_capture_sizes": [1, 2, 4, 8, 16, 32], "max_cudagraph_capture_size": 32}'
      --speculative-config '{"method": "mtp", "num_speculative_tokens": 4}'
      --disable-custom-all-reduce
      --enable-prefix-caching
      --mamba-cache-mode align
      --engram-config '{"cpu_offload": true}'
      --reasoning-parser qwen3
      --tool-call-parser qwen3_coder
      --enable-auto-tool-choice
      --default-chat-template-kwargs '{"reasoning_effort": "medium"}'
      --trust-remote-code
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 900s
      timeout: 10s
      retries: 3
      start_period: 1200s
volumes:
  hf-cache:
  flashnext-cache-triton:
  flashnext-cache-torchinductor:
  flashnext-cache-vllm:
  flashnext-cache-nvidia-cuda:
  flashnext-cache-torch_extensions:
