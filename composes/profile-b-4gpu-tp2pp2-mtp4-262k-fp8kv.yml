# Profile B — 4x RTX 3090: max context per 4 GPUs. RECOMMENDED DEFAULT.
#   v2 image (vLLM 0.13 base, VLLM_DETERMINISTIC_MOE_ALIGN=0). Measured
#   (2026-09-14/16, 12-pass pooled meter): P1 105.6 tok/s, 4-stream aggregate
#   median ~267 (ceiling 279), KV pool 438,539 (1.67x @ full 262,144 context),
#   INT4 draft + FP8 E4M3 KV. DET=0 alternates fast/slow passes (~215 floor /
#   ~270 ceiling); medians pool both bands — quote medians, not single passes.
# Uses halt95's ORIGINAL checkpoint AS-IS (no surgery needed). ~46-51 GiB host RAM
# pinned for the CPU-offloaded FP8 PLE table. max_num_seqs=4: the 4-stream test
# IS the cap. FP8 acceptance ~3.0 under load — inherent numerics.
# Sustained a ~4h15m real-traffic shift with no restarts (2026-09-16).
# Run:
#   cd <this-repo>/composes && MODEL=/path/to/halt95-merlin-checkpoint VLLM_API_KEY=... \
#     docker compose -f profile-b-4gpu-tp2pp2-mtp4-262k-fp8kv.yml up -d
services:
  vllm:
    image: ghcr.io/jon-nielsen/vllm-backport-flashnext-sm86:2b21fbe-bfe237ee
    container_name: flashnext-3090-4gpu-262k
    ports:
      - "8000:8000"
    devices:
      - nvidia.com/gpu=all
    shm_size: "32g"
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    environment:
      - CUDA_VISIBLE_DEVICES=0,1,2,7
      - VLLM_PLE_FP8_EMBEDDING=1
      - VLLM_DETERMINISTIC_MOE_ALIGN=0
      - NCCL_ALGO=Ring
      - NCCL_PROTO=LL128
      - NCCL_P2P_DISABLE=1
      - VLLM_SKIP_P2P_CHECK=1
      - VLLM_QSA_KV_SCALES=/opt/qsa_kv_scales_262k.json
      - TRITON_CACHE_DIR=/root/cache/triton
      - TORCHINDUCTOR_CACHE_DIR=/root/cache/torchinductor
      - VLLM_CACHE_ROOT=/root/cache/vllm
      - CUDA_CACHE_PATH=/root/cache/nvidia-cuda
      - TORCH_EXTENSIONS_DIR=/root/cache/torch_extensions
    volumes:
      - ${MODEL}:/model:ro




      - hf-cache:/root/.cache/huggingface
      - flashnext-cache-triton:/root/cache/triton
      - flashnext-cache-torchinductor:/root/cache/torchinductor
      - flashnext-cache-vllm:/root/cache/vllm
      - flashnext-cache-nvidia-cuda:/root/cache/nvidia-cuda
      - flashnext-cache-torch_extensions:/root/cache/torch_extensions
    command: |
      --model /model
      --served-model-name Qwen3.8-Flash-Next
      --api-key ${VLLM_API_KEY:?set VLLM_API_KEY}
      --tensor-parallel-size 2
      --pipeline-parallel-size 2
      --enable-expert-parallel
      --gpu-memory-utilization 0.94
      --max-model-len 262144
      --kv-cache-dtype fp8
      --max-num-seqs 4
      --max-num-batched-tokens 2048
      --compilation-config '{"cudagraph_mode": "FULL_AND_PIECEWISE", "cudagraph_capture_sizes": [1, 2, 4, 8, 16, 20], "max_cudagraph_capture_size": 20}'
      --speculative-config '{"method": "mtp", "num_speculative_tokens": 4}'
      --disable-custom-all-reduce
      --enable-prefix-caching
      --mamba-cache-mode align
      --engram-config '{"cpu_offload": true}'
      --reasoning-parser qwen3
      --tool-call-parser qwen3_coder
      --enable-auto-tool-choice
      --default-chat-template-kwargs '{"reasoning_effort": "medium"}'
      --trust-remote-code
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 900s
      timeout: 10s
      retries: 3
      start_period: 1200s
volumes:
  hf-cache:
  flashnext-cache-triton:
  flashnext-cache-torchinductor:
  flashnext-cache-vllm:
  flashnext-cache-nvidia-cuda:
  flashnext-cache-torch_extensions:
